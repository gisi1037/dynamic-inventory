/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this mod
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - compileOnlyApi("g:n:v:c"): like compileOnly, but also visible at compiletime for mods depending on this mod
 *       Available at compiletime but not runtime for mods depending on this mod
 *  - runtimeOnlyNonPublishable("g:n:v:c"): if you want to include a mod in this mod's runClient/runServer runs, but not publish it as a dependency
 *       Not available at all for mods depending on this mod, only visible at runtime for this mod
 *  - devOnlyNonPublishable("g:n:v:c"): a combination of runtimeOnlyNonPublishable and compileOnly for dependencies present at both compiletime and runtime,
 *       but not published as Maven dependencies - useful for RFG-deobfuscated dependencies or local testing
 *  - runtimeOnly("g:n:v:c"): if you don't need this at compile time, but want it to be present at runtime
 *       Available at runtime for mods depending on this mod
 *  - annotationProcessor("g:n:v:c"): mostly for java compiler plugins, if you know you need this, use it, otherwise don't worry
 *  - testCONFIG("g:n:v:c") - replace CONFIG by one of the above (except api), same as above but for the test sources instead of main
 *
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 *
 *  - compile("g:n:v:c"): deprecated, replace with "api" (works like the old "compile") or "implementation" (can be more efficient)
 *
 * You can exclude transitive dependencies (dependencies of the chosen dependency) by appending { transitive = false } if needed,
 * but use this sparingly as it can break using your mod as another mod's dependency if you're not careful.
 *
 * To depend on obfuscated jars you can use `devOnlyNonPublishable(rfg.deobf("dep:spec:1.2.3"))` to fetch an obfuscated jar from maven,
 * or `devOnlyNonPublishable(rfg.deobf(project.files("libs/my-mod-jar.jar")))` to use a file.
 *
 * Gradle names for some of the configuration can be misleading, compileOnlyApi and runtimeOnly both get published as dependencies in Maven, but compileOnly does not.
 * The buildscript adds runtimeOnlyNonPublishable to also have a runtime dependency that's not published.
 *
 * For more details, see https://docs.gradle.org/8.0.1/userguide/java_library_plugin.html#sec:java_library_configurations_graph
 */
apply from: "gradle/integration-profiles.gradle"
def inventoryProfile = providers.gradleProperty("inventoryProfile").getOrElse("isolated")
def pins = inventoryPins
def pin = inventoryPin

dependencies {
    // Optional integration APIs only; never add these mods to the isolated runtime or published POM.
    ["Baubles-Expanded", "NotEnoughItems", "CodeChickenCore", "InventoryBogoSorter",
        "ModularUI2", "ModularUI", "TinkersConstruct", "Galacticraft", "OpenBlocks", "OpenModsLib"].each { name ->
        compileOnly("com.github.GTNewHorizons:${name}:${pin(name)}:dev") { transitive = false }
    }
    // GTNHExtLib bundles this at runtime; Bogo's refill field exposes its API directly.
    compileOnly("it.unimi.dsi:fastutil:8.5.18") { transitive = false }
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:GTNHExtLib:${pin('GTNHExtLib')}")
}

if (project.hasProperty("inventoryTinkersTests") && !inventoryFullIntegration) {
    throw new GradleException("inventoryTinkersTests requires a full integration fixture")
}
if (project.hasProperty("inventoryActionTests") && !inventoryFullIntegration) {
    throw new GradleException("inventoryActionTests requires a full integration fixture")
}
if (inventoryProfile != "isolated") {
    // Override transitive defaults only in an explicitly selected fixture.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.github.GTNewHorizons" && pins.containsKey(details.requested.name)) {
                details.useVersion(pins[details.requested.name])
                details.because("Pinned GTNH ${inventoryPackTarget} compatibility fixture")
            }
        }
    }
    dependencies {
        devOnlyNonPublishable("com.github.GTNewHorizons:ModularUI2:${pin('ModularUI2')}:dev")
        devOnlyNonPublishable("com.github.GTNewHorizons:ModularUI:${pin('ModularUI')}:dev") { transitive = false }
        if (inventoryBackhand) {
            devOnlyNonPublishable("com.github.GTNewHorizons:Backhand:${pin('Backhand')}:dev")
            runtimeOnlyNonPublishable("com.github.GTNewHorizons:Battlegear2-for-Backhand:${pin('Battlegear2-for-Backhand')}:dev")
        }
        if (inventoryFullIntegration) {
            devOnlyNonPublishable("com.github.GTNewHorizons:InventoryBogoSorter:${pin('InventoryBogoSorter')}:dev")
            if (project.hasProperty("inventoryTinkersTests")) {
                // Opt-in runtime for the native oversized-stack opening regression, not full-pack evidence.
                // Keep unrelated transitive mods out of this source-level test.
                runtimeOnlyNonPublishable("com.github.GTNewHorizons:TinkersConstruct:${pin('TinkersConstruct')}:dev") { transitive = false }
                runtimeOnlyNonPublishable("com.github.GTNewHorizons:Mantle:${pin('Mantle')}:dev") { transitive = false }
            }
            if (project.hasProperty("inventoryActionTests")) {
                // This pinned release has no Maven development artifact. Remap a caller-supplied
                // installed RC-2 JAR for local qualification only; never publish or infer a user path.
                def craftingTweaksPath = providers.gradleProperty("inventoryCraftingTweaksJar").orNull
                if (!craftingTweaksPath || !new File(craftingTweaksPath).isAbsolute()) {
                    throw new GradleException("inventoryActionTests requires -PinventoryCraftingTweaksJar=absolutePath to craftingtweaks-1.0.3.jar")
                }
                def craftingTweaksJar = file(craftingTweaksPath)
                def referenceFiles = new groovy.json.JsonSlurper().parse(file("pack-compatibility-rc2.json")).installedFiles
                def expectedHash = referenceFiles.find { it.file == "craftingtweaks-1.0.3.jar" }.sha256
                if (!craftingTweaksJar.isFile() || !java.security.MessageDigest.getInstance("SHA-256")
                    .digest(craftingTweaksJar.bytes).encodeHex().toString().equalsIgnoreCase(expectedHash)) {
                    throw new GradleException("CraftingTweaks JAR does not match the pinned RC-2 1.0.3 checksum")
                }
                // A file dependency is a leaf: it cannot bring transitive mods into this fixture.
                runtimeOnlyNonPublishable(rfg.deobf(project.files(craftingTweaksJar)))
            }
        }
    }
}
